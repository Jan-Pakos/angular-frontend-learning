<div class="appointment-page">

  <div class="card appointment-form-card">
    <div class="card-header appointment-form-header">
      <h5 class="mb-0">New Appointment</h5>
    </div>
    <div class="card-body">
      <div class="row g-3 align-items-end">
        <div class="col-md-5">
          <label class="form-label">Title</label>
          <input
            [(ngModel)]="newAppointmentTitle"
            placeholder="Enter appointment title"
            type="text"
            class="form-control appointment-input"
          />
        </div>
        <div class="col-md-4">
          <label class="form-label">Date</label>
          <input
            [(ngModel)]="newAppointmentDate"
            type="date"
            class="form-control appointment-input"
          />
        </div>
        <div class="col-md-3">
          <button (click)="addAppointment()" class="btn btn-primary add-btn w-100">
            + Add Appointment
          </button>
        </div>
      </div>
    </div>
  </div>

  <div class="card appointment-list-card">
    <div class="card-header appointment-list-header">
      <h5 class="mb-0">Appointments</h5>
      <span class="badge appointment-count">{{ appointments.length }}</span>
    </div>
    <ul class="list-group list-group-flush">
      @for (appointment of appointments; track appointment.id) {
        <li class="list-group-item appointment-item">
          <div class="appointment-info">
            <span class="appointment-title">{{ appointment.title }}</span>
            <span class="appointment-date">{{ appointment.date | date:'mediumDate' }}</span>
          </div>
          <button
            (click)="deleteAppointment(appointment.id)"
            class="btn delete-btn"
          >
            Delete
          </button>
        </li>
      } @empty {
        <li class="list-group-item empty-state">
          <span class="empty-icon">🗓️</span>
          <p class="empty-text">No appointments yet. Add one above!</p>
        </li>
      }
    </ul>
  </div>

</div>
